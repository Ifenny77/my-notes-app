<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note to Self</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .note-card { transition: transform 0.2s; }
        .note-card:hover { transform: scale(1.02); }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h1 class="text-center mb-4">📝 Note to Self</h1>
                
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <form action="/add" method="POST" class="input-group">
                            <input type="text" name="content" class="form-control" placeholder="What's on your mind?" required>
                            <button type="submit" class="btn btn-primary">Add Note</button>
                        </form>
                    </div>
                </div>

                <div class="list-group">
                    {% for note in notes %}
                    <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center note-card mb-2 shadow-sm rounded">
                        {{ note.content }}
                        <span class="badge bg-light text-muted" style="font-size: 0.7rem;">
                            {{ note.date_created.strftime('%H:%M') }}
                        </span>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
